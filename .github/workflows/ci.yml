name: ci

# CI runs without a GPU. Anything requiring CUDA is marked `gpu` and runs on
# the workstation instead (docs/25 §2), which is also what keeps the
# application track independent of the ML track.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIPELINE_MODE: mock

jobs:
  python:
    name: python (lint · typecheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -m "not gpu" --cov --cov-report=term-missing

  typescript:
    name: typescript (lint · typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm exec eslint .
      - run: pnpm exec tsc --build

  contracts:
    name: contracts are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      # A spec change that would break the generated client fails here, on
      # the pull request that caused it, rather than at runtime after deploy.
      - run: make contracts-check

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stack:
    name: compose stack boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring up services
        run: docker compose -f infra/docker/compose.yaml up -d --wait postgres redis minio mailhog
      - name: Verify each service answers
        run: |
          docker exec visiovox-postgres-1 pg_isready -U visiovox -d visiovox
          docker exec visiovox-redis-1 redis-cli ping
          curl -fsS http://localhost:9000/minio/health/live
          curl -fsS -o /dev/null http://localhost:8025/
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v
