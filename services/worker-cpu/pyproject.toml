[project]
name = "visiovox-worker-cpu"
version = "0.1.0"
description = "Ingest and packaging worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "visiovox-api",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "sqlalchemy>=2.0.36",
  "psycopg2-binary>=2.9",
]

[tool.uv.sources]
visiovox-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker_cpu"]
